<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculater_By_Aqib</title>
</head>
<body>
    <div class="calculater_box">
        <div class="containter_div">
        
            <div class="user_input" id="data">
                <input type="text" placeholder="0" id="">
            </div>

           <div class="row_first">
            <button class="operater">AC</button>
            <button class="operater">DEL</button>
            <button class="operater">%</button>
            <button class="operater">/</button>
            </div>
            
            <div class="row_second">
            <button class="seven">7</button>
            <button class="seven">8</button>
            <button class="seven">9</button>
            <button class="operater">*</button>
          </div>
        
          <div class="row_third">
            <button class="seven">4</button>
            <button class="seven">5</button>
            <button class="seven">6</button>
            <button class="operater">-</button>
          </div>
        
          <div class="row_fourth">
            <button class="seven">1</button>
            <button class="seven">2</button>
            <button class="seven">3</button>
            <button class="operater">+</button>
          </div>
        
          <div class="row_fifth">
            <button class="seven">00</button>
            <button class="seven">0</button>
            <button class="seven">.</button>
            <button class="equalBtn">=</button>
        
          </div>
       

            

        </div>

    </div>

    <script src="script.js"></script>
        
</body>
</html>
